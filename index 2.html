<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메뉴 · 원가</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0ee;--card:#fff;--ink:#14211b;--sub:#66726b;--line:#dce2de;--ac:#1d4a39;--aci:#fff;--gold:#a8842f;--g:#1d7a4f;--o:#a26a00;--r:#b3382f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1713;--card:#16221c;--ink:#eef2ee;--sub:#9aa8a0;--line:#26362e;--ac:#c9a45c;--aci:#0e1713;--gold:#c9a45c;--g:#6fd09a;--o:#e0b45a;--r:#ee7f76}}
:root[data-theme="dark"]{--bg:#0e1713;--card:#16221c;--ink:#eef2ee;--sub:#9aa8a0;--line:#26362e;--ac:#c9a45c;--aci:#0e1713;--gold:#c9a45c;--g:#6fd09a;--o:#e0b45a;--r:#ee7f76}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;line-height:1.55}
main{max-width:560px;margin:0 auto;padding:24px 18px 64px}
h1{font-family:"Noto Serif KR",serif;font-size:28px;margin:0;letter-spacing:-.01em}
.rule{height:1px;background:var(--gold);width:48px;margin:10px 0 6px}
.hint{color:var(--sub);font-size:13px;margin:0 0 18px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:18px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs button{flex:1;background:none;color:var(--sub);padding:12px 4px;border-radius:0;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
section[hidden]{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
label{font-size:12px;color:var(--sub);display:grid;gap:5px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;border:0;border-radius:10px;padding:13px;background:var(--ac);color:var(--aci);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--sub);padding:6px 8px;font-weight:400;font-size:13px}
button.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.stats{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:"Noto Serif KR",serif;font-size:22px}.stat span{font-size:12px;color:var(--sub)}
.stat input{padding:6px;font-size:18px;width:70px}
.cat{font-family:"Noto Serif KR",serif;font-size:17px;margin:22px 0 6px;color:var(--gold)}
.menu{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:12px 0}
summary::-webkit-details-marker{display:none}
.mrow{display:flex;align-items:baseline;gap:8px}
.mrow .nm{font-weight:600;font-size:16px}
.lead{flex:1;border-bottom:1px dotted var(--sub);opacity:.5;transform:translateY(-4px)}
.pr{font-family:"Noto Serif KR",serif;font-weight:700}
.sub2{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:12px;color:var(--sub)}
.pill{font-weight:600;font-size:12px;padding:1px 9px;border-radius:99px;border:1px solid currentColor}
.g{color:var(--g)}.o{color:var(--o)}.r{color:var(--r)}
.dt{padding:0 0 14px;font-size:14px}
.dt table{width:100%;border-collapse:collapse}.dt td{padding:4px 0;border-bottom:1px solid var(--line)}.dt td:last-child{text-align:right}
.dt .tot td{font-weight:700;border-bottom:0}
.empty{text-align:center;color:var(--sub);padding:30px 8px;border:1px dashed var(--line);border-radius:14px}
.irow{display:grid;grid-template-columns:1fr 78px 64px 28px;gap:6px;align-items:center}
.irow output{font-size:12px;color:var(--sub);text-align:right}
.irow .x{padding:4px;background:none;color:var(--sub)}
.res{border-top:1px solid var(--gold);padding-top:12px;display:grid;gap:6px;font-size:14px}
.res div{display:flex;justify-content:space-between}.res b{font-family:"Noto Serif KR",serif}
.ing{display:grid;grid-template-columns:1fr 100px auto;gap:8px;align-items:center}.iw{padding:8px 0;border-bottom:1px solid var(--line)}.imore{display:grid;gap:8px;padding:8px 0 4px}.imore[hidden]{display:none}.sup{font-size:12px;color:var(--gold);margin-left:4px}
.ing .x{padding:4px;background:none;color:var(--sub)}
.btns{display:flex;gap:8px}.btns button{flex:1;padding:10px}
details.bk{margin-top:26px;color:var(--sub);font-size:13px}details.bk textarea{width:100%;min-height:90px;margin:8px 0;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
.search{margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{background:transparent;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:13px;font-weight:600}
.chip.on{background:var(--ac);color:var(--aci);border-color:var(--ac)}
.sm{display:flex;gap:12px;align-items:center}.sm .body{flex:1;min-width:0}
.th{width:56px;height:56px;border-radius:10px;background:var(--bg) center/cover;flex:none}
#pv{max-height:150px;border-radius:10px;object-fit:cover;display:none}
.dt img{width:100%;border-radius:10px;margin-bottom:8px}
.unit{font-size:11px;color:var(--sub)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;display:none;z-index:30;max-width:90%;text-align:center}
</style>
</head>
<body>
<main>
<h1>메뉴 · 원가</h1><div class="rule"></div>
<p class="hint">재료비만 계산해요. 인건비·관리비는 빼요. 기록은 이 기기에만 저장돼요.</p>
<nav class="tabs" role="tablist">
<button role="tab" data-t="board" aria-selected="true">메뉴판</button>
<button role="tab" data-t="edit" aria-selected="false">메뉴 만들기</button>
<button role="tab" data-t="ing" aria-selected="false">재료 단가</button>
</nav>

<section id="v-board">
<div class="stats"><div class="stat"><b id="sCnt">0</b><span>메뉴 수</span></div><div class="stat"><b id="sAvg">-</b><span>평균 원가율</span></div>
<div class="stat"><label style="gap:2px">목표 원가율(%)<input id="tgt" type="number" min="1" max="100" inputmode="numeric"></label></div></div>
<input class="search" id="q" type="search" placeholder="메뉴·재료로 검색" aria-label="검색">
<div class="chips" id="cats"></div>
<div id="board"></div>
<details class="bk"><summary>백업 · 복원 (폰을 바꾸기 전에 꼭!)</summary>
<textarea id="bk" placeholder="내보내기를 누르면 백업 글자가 나와요. 복사해서 카톡 나와의 채팅에 보관하세요."></textarea>
<div class="btns"><button type="button" id="exp">내보내기</button><button type="button" id="imp">가져오기</button></div></details>
</section>

<section id="v-edit" hidden>
<div class="panel">
<label>메뉴 이름<input id="mname" maxlength="30" placeholder="예: 트러플 크림 파스타"></label>
<div class="row"><label>카테고리<select id="mcat"><option>메인</option><option>사이드</option><option>음료</option><option>디저트</option><option>기타</option></select></label>
<label>판매가(원)<input id="mprice" type="number" min="0" inputmode="numeric" placeholder="13000"></label></div>
<input id="mcatEtc" maxlength="12" placeholder="카테고리를 직접 입력 (예: 국물요리)" aria-label="기타 카테고리" hidden>
<label>메뉴 사진<input id="mphotoIn" type="file" accept="image/*"></label>
<img id="pv" alt="사진 미리보기"><button type="button" class="ghost" id="delPhoto" hidden>사진 지우기</button>
<div id="rows" style="display:grid;gap:8px"></div>
<button type="button" class="line" id="addRow">+ 재료 추가</button>
<div class="res"><div><span>총 재료 원가</span><b id="rCost">0원</b></div><div><span>원가율</span><b id="rPct">-</b></div><div><span>예상 마진</span><b id="rMar">-</b></div><div><span>목표 원가율 기준 권장 판매가</span><b id="rRec">-</b></div></div>
<button type="button" id="save">메뉴 저장</button>
<button type="button" class="ghost" id="reset">새 메뉴로 비우기</button>
</div>
</section>

<section id="v-ing" hidden>
<div class="panel">
<div class="row"><label>재료 이름<input id="iname" maxlength="20" placeholder="예: 생크림"></label>
<label>가격 기준<select id="iunit"><option value="g">1kg(1L)당 가격</option><option value="ea">1개당 가격</option></select></label></div>
<label>가격(원)<input id="iprice" type="number" min="0" inputmode="numeric" placeholder="8500"></label>
<button type="button" id="addIng">재료 추가</button>
<div id="ilist"></div>
</div>
</section>
</main>

<div id="toast" role="status"></div>
<script>
const KEY="cook-cost-v1",$=id=>document.getElementById(id);
let D={ings:[],menus:[],target:30},editId=null,rows=[{ing:"",g:""}],curPhoto="",fq="",fc="";
const STD=["메인","사이드","음료","디저트","기타"];const uq=i=>i&&i.unit==="ea"?"개":"g";
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.ings)D=s}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){say("저장하지 못했어요. 백업을 해두세요.")}}
let tt;function say(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",2800)}
function twice(b,txt,fn){let on=false,orig=b.textContent,tm;b.onclick=()=>{if(on){clearTimeout(tm);fn();return}on=true;b.textContent=txt;tm=setTimeout(()=>{on=false;b.textContent=orig},3000)}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const won=n=>Math.round(n).toLocaleString("ko-KR")+"원";
const ing=id=>D.ings.find(i=>i.id===id);
const cost=it=>{const i=ing(it.ing);if(!i)return 0;const q=Number(it.g)||0;return i.unit==="ea"?i.price*q:i.price/1000*q};
const tot=m=>m.items.reduce((a,it)=>a+cost(it),0);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
const cls=p=>p<=D.target?"g":p<=D.target+5?"o":"r";

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>go(b.dataset.t));
function go(t){document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.t===t));
  ["board","edit","ing"].forEach(k=>$("v-"+k).hidden=k!==t);if(t==="edit")renderRows();renderAll()}

/* 재료 단가 */
$("addIng").onclick=()=>{const n=$("iname").value.trim(),p=Number($("iprice").value);
  if(!n||!(p>=0)||$("iprice").value===""){say("재료 이름과 1kg당 가격을 입력해 주세요.");return}
  D.ings.push({id:uid(),name:n,price:p,unit:$("iunit").value});save();$("iname").value="";$("iprice").value="";renderAll()};
function renderIng(){const L=$("ilist");L.textContent="";
  if(!D.ings.length){L.append(el("div","empty","재료와 1kg당 가격을 먼저 넣어두세요. 메뉴 원가가 자동으로 계산돼요."));return}
  D.ings.forEach(i=>{const r=el("div","ing"),n=el("span",null,i.name+" "),p=el("input");n.append(el("span","unit",i.unit==="ea"?"(1개당)":"(1kg당)"));p.type="number";p.value=i.price;p.inputMode="numeric";p.setAttribute("aria-label",i.name+" 1kg당 가격");
    p.onchange=()=>{i.price=Number(p.value)||0;save();renderAll()};
    const x=el("button","x","✕");x.type="button";x.setAttribute("aria-label","삭제");twice(x,"삭제?",()=>{D.ings=D.ings.filter(z=>z!==i);save();renderAll()});
    const w=el("div","iw"),mb=el("button","ghost","더보기 ▾"),pn=el("div","imore"),sp=el("span","sup",i.sup?"· "+i.sup:"");pn.hidden=true;
    [["거래처","sup","예: 가락시장 ○○상회","text"],["연락처","tel","예: 010-0000-0000","tel"],["메모 (규격·주문 단위 등)","note","예: 1kg 단위 주문, 화·금 배송","text"]].forEach(([lb,k,ph,ty])=>{
      const l=el("label",null,lb),inp=el("input");inp.type=ty;inp.maxLength=60;inp.placeholder=ph;inp.value=i[k]||"";
      inp.oninput=()=>{i[k]=inp.value;if(k==="sup")sp.textContent=inp.value?"· "+inp.value:"";save()};l.append(inp);pn.append(l)});
    mb.onclick=()=>{pn.hidden=!pn.hidden;mb.firstChild.textContent=pn.hidden?"더보기 ▾":"접기 ▴"};mb.append(sp);
    r.append(n,p,x);w.append(r,mb,pn);L.append(w)})}

/* 메뉴 만들기 */
$("addRow").onclick=()=>{rows.push({ing:"",g:""});renderRows()};
function renderRows(){const box=$("rows");box.textContent="";
  if(!D.ings.length){box.append(el("div","empty","먼저 '재료 단가' 탭에서 재료를 추가해 주세요."));calc();return}
  rows.forEach((r,idx)=>{const w=el("div","irow"),s=el("select");s.setAttribute("aria-label","재료");
    const o0=el("option",null,"재료 선택");o0.value="";s.append(o0);
    D.ings.forEach(i=>{const o=el("option",null,i.name+(i.unit==="ea"?" (개)":" (g)"));o.value=i.id;s.append(o)});s.value=r.ing;
    const g=el("input");g.type="number";g.min=0;g.inputMode="numeric";g.placeholder="g";g.value=r.g;g.setAttribute("aria-label","그램");
    const c=el("output",null,"0원");const ph=()=>{const i=ing(r.ing);g.placeholder=i?uq(i):"수량";g.setAttribute("aria-label","수량("+(i?uq(i):"단위")+")")};ph();
    const sync=()=>{c.textContent=won(cost(r))};
    s.onchange=()=>{r.ing=s.value;ph();sync();calc()};g.oninput=()=>{r.g=g.value;sync();calc()};sync();
    const x=el("button","x","✕");x.type="button";x.setAttribute("aria-label","행 삭제");x.onclick=()=>{rows.splice(idx,1);if(!rows.length)rows.push({ing:"",g:""});renderRows()};
    w.append(s,g,c,x);box.append(w)});calc()}
function calc(){const c=rows.reduce((a,r)=>a+cost(r),0),p=Number($("mprice").value)||0;
  $("rCost").textContent=won(c);
  if(p>0){const pc=c/p*100;$("rPct").textContent=pc.toFixed(1)+"%";$("rPct").className=cls(pc);$("rMar").textContent=won(p-c)}else{$("rPct").textContent="-";$("rPct").className="";$("rMar").textContent="-"}
  $("rRec").textContent=c>0?won(Math.ceil(c/(D.target/100)/100)*100):"-"}
$("mprice").oninput=calc;
$("save").onclick=()=>{const n=$("mname").value.trim(),items=rows.filter(r=>r.ing&&Number(r.g)>0).map(r=>({ing:r.ing,g:Number(r.g)}));
  if(!n){say("메뉴 이름을 입력해 주세요.");return}if(!items.length){say("재료와 그램 수를 한 줄 이상 넣어주세요.");return}
  const m={id:editId||uid(),name:n,cat:($("mcat").value==="기타"&&$("mcatEtc").value.trim())?$("mcatEtc").value.trim():$("mcat").value,price:Number($("mprice").value)||0,items,photo:curPhoto};
  const k=D.menus.findIndex(z=>z.id===m.id);if(k>=0)D.menus[k]=m;else D.menus.push(m);
  save();clearForm();go("board")};
function clearForm(){editId=null;rows=[{ing:"",g:""}];$("mname").value="";$("mprice").value="";$("mcat").value="메인";$("mcatEtc").value="";$("mcatEtc").hidden=true;$("mphotoIn").value="";setPhoto("");renderRows()}
$("reset").onclick=clearForm;
function editMenu(m){editId=m.id;$("mname").value=m.name;const std=STD.includes(m.cat);$("mcat").value=std?m.cat:"기타";$("mcatEtc").value=std?"":m.cat;$("mcatEtc").hidden=$("mcat").value!=="기타";setPhoto(m.photo||"");$("mprice").value=m.price||"";rows=m.items.map(i=>({ing:i.ing,g:i.g}));go("edit")}

/* 메뉴판 */
function catsOf(){const ex=[];D.menus.forEach(m=>{if(!STD.includes(m.cat)&&!ex.includes(m.cat))ex.push(m.cat)});return STD.concat(ex).filter(c=>D.menus.some(m=>m.cat===c))}
function renderBoard(){const B=$("board");B.textContent="";
  $("sCnt").textContent=D.menus.length;
  const w=D.menus.filter(m=>m.price>0);$("sAvg").textContent=w.length?(w.reduce((a,m)=>a+tot(m)/m.price*100,0)/w.length).toFixed(1)+"%":"-";
  const cs=$("cats");cs.textContent="";const cl=catsOf();if(fc&&!cl.includes(fc))fc="";
  ["",...cl].forEach(c=>{const b=el("button","chip"+(fc===c?" on":""),c||"전체");b.type="button";b.onclick=()=>{fc=c;renderBoard()};cs.append(b)});
  if(!D.menus.length){B.append(el("div","empty","아직 메뉴가 없어요. '재료 단가'에서 재료를 넣고, '메뉴 만들기'에서 메뉴를 구성해보세요."));return}
  const q=fq.trim().toLowerCase();
  const match=m=>(!fc||m.cat===fc)&&(!q||(m.name+" "+m.cat+" "+m.items.map(it=>{const i=ing(it.ing);return i?i.name:""}).join(" ")).toLowerCase().includes(q));
  let any=false;
  cl.forEach(cat=>{const ms=D.menus.filter(m=>m.cat===cat&&match(m));if(!ms.length)return;any=true;B.append(el("div","cat",cat));
    ms.forEach(m=>{const d=el("details","menu"),s=el("summary"),sm=el("div","sm"),t=tot(m),pc=m.price>0?t/m.price*100:null;
      if(m.photo){const th=el("div","th");th.style.backgroundImage="url("+m.photo+")";sm.append(th)}
      const bd=el("div","body"),r=el("div","mrow");r.append(el("span","nm",m.name),el("span","lead"),el("span","pr",m.price?won(m.price):"가격 미정"));
      const s2=el("div","sub2");s2.append(el("span",null,"원가 "+won(t)));if(pc!=null)s2.append(el("span","pill "+cls(pc),"원가율 "+pc.toFixed(1)+"%"));
      bd.append(r,s2);sm.append(bd);s.append(sm);const dt=el("div","dt");
      if(m.photo){const im=el("img");im.src=m.photo;im.alt=m.name;dt.append(im)}
      const tb=el("table");
      m.items.forEach(it=>{const i=ing(it.ing),tr=el("tr");tr.append(el("td",null,(i?i.name:"삭제된 재료")+" "+it.g+uq(i)),el("td",null,won(cost(it))));tb.append(tr)});
      const tr=el("tr","tot");tr.append(el("td",null,"합계"),el("td",null,won(t)));tb.append(tr);dt.append(tb);
      const e=el("button","ghost","수정");e.type="button";e.onclick=()=>editMenu(m);
      const x=el("button","ghost","삭제");x.type="button";twice(x,"한 번 더 누르면 삭제",()=>{D.menus=D.menus.filter(z=>z!==m);save();renderAll()});
      dt.append(e,x);d.append(s,dt);B.append(d)})});
  if(!any)B.append(el("div","empty","조건에 맞는 메뉴가 없어요."))}
function setPhoto(d){curPhoto=d;$("pv").src=d||"";$("pv").style.display=d?"block":"none";$("delPhoto").hidden=!d}
$("mphotoIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);setPhoto(c.toDataURL("image/jpeg",.7));URL.revokeObjectURL(u)};im.src=u};
$("delPhoto").onclick=()=>{setPhoto("");$("mphotoIn").value=""};
$("mcat").onchange=()=>{$("mcatEtc").hidden=$("mcat").value!=="기타"};
$("q").oninput=()=>{fq=$("q").value;renderBoard()};

$("tgt").value=D.target;$("tgt").onchange=()=>{const v=Number($("tgt").value);D.target=v>0&&v<=100?v:30;$("tgt").value=D.target;save();renderAll()};
$("exp").onclick=()=>{$("bk").value=JSON.stringify(D);$("bk").select()};
twice($("imp"),"한 번 더 누르면 덮어써요",()=>{try{const d=JSON.parse($("bk").value);if(!d||!Array.isArray(d.ings)||!Array.isArray(d.menus))throw 0;
  D=d;if(!D.target)D.target=30;$("tgt").value=D.target;save();renderAll();say("백업을 불러왔어요")}catch(e){say("백업 글자가 올바르지 않아요. 내보내기로 만든 글자를 그대로 붙여넣어 주세요.")}});
function renderAll(){renderBoard();renderIng();calc()}
renderAll();
</script>
